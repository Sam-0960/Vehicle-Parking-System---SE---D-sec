name: PR Check

# Keeps the sprint board honest: every PR must close a backlog issue,
# so the GitHub Project moves the card to In Progress / Done automatically.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: write
  issues: write

jobs:
  linked-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Require "Fixes #N" in the PR description
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || "";
            const refs = [...body.matchAll(/(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/gi)].map(m => m[1]);
            if (refs.length === 0) {
              core.setFailed('PR description must link a backlog issue, e.g. "Fixes #5".');
              return;
            }
            core.info(`Linked issues: ${refs.join(", ")}`);

      - name: Label PR by sprint
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;
            const m = branch.match(/fr-(\d+)/i);
            const labels = [];
            if (m) {
              const fr = parseInt(m[1], 10);
              labels.push(fr <= 6 ? "sprint-1" : "sprint-2");
              labels.push(`FR-${String(fr).padStart(2, "0")}`);
            }
            if (/nfr/i.test(branch)) labels.push("sprint-2", "NFR");
            if (labels.length) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                labels: [...new Set(labels)],
              });
            }
