{% extends "base.html" %}
{% block title %}Alerts{% endblock %}
{% block content %}
<h1>Alerts</h1>
{% for n in notices %}
  <div class="card notice {% if not n.is_read %}unread{% endif %}">
    <div class="spread"><strong>{{ n.kind|capitalize }}</strong><small class="muted">{{ n.created_at[:16] }}</small></div>
    <p>{{ n.message }}</p>
  </div>
{% else %}
  <div class="card"><p class="muted">No alerts yet.</p></div>
{% endfor %}
{% endblock %}
