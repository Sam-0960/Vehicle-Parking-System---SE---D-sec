{% extends "base.html" %}
{% from "_macros.html" import csrf with context %}
{% block title %}Register{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Create an account</h1>
  <form method="post">
    {{ csrf() }}
    <label>Full name <input name="name" value="{{ form.get('name', '') }}" required maxlength="80" autocomplete="name"></label>
    <label>Email <input type="email" name="email" value="{{ form.get('email', '') }}" required autocomplete="email"></label>
    <label>Password <span class="hint">At least 8 characters, with a letter and a number.</span>
      <input type="password" name="password" required minlength="8" autocomplete="new-password"></label>
    <label>Confirm password <input type="password" name="confirm" required autocomplete="new-password"></label>
    <button type="submit">Register</button>
  </form>
  <p class="muted">Already registered? <a href="{{ url_for('auth.login') }}">Log in</a></p>
</section>
{% endblock %}
