{% extends "base.html" %}
{% from "_macros.html" import csrf with context %}
{% block title %}Log in{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Log in</h1>
  <p class="muted">Use the email and password you registered with.</p>
  <form method="post">
    {{ csrf() }}
    <label>Email <input type="email" name="email" value="{{ email }}" required autocomplete="email"></label>
    <label>Password <input type="password" name="password" required autocomplete="current-password"></label>
    <button type="submit">Log in</button>
  </form>
  <p class="muted">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
</section>
{% endblock %}
